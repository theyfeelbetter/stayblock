name: V3 static smoke
on:
  pull_request:
    paths:
      - 'app.html'
      - 'ui/**'
      - 'tests/v3-static-smoke.test.cjs'
      - 'tests/v3-calendar-date.test.cjs'
      - 'tests/v3-reservation-conflicts.test.cjs'
      - '.github/workflows/v3-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v3-static-smoke.test.cjs tests/v3-calendar-date.test.cjs tests/v3-reservation-conflicts.test.cjs
